cwMethod2Description=Execute Service With OAuth2

cwMethod2Link=Download Source Code

cwMethod2LinkSource=Source Code

cwMethod2Name=Networking

cwMethod2P1Title=OAuth2.0

cwMethod2P1content=There are 2 faces in GWT, a client side and a server side. In my authentication, the client give an authentication request to Certification Authority under the condition that the user sets its call back to a server side servlet at the Google Api Console. So, this needs a procedure of OAuth server specification. The servlet gets the [code] at hand, not the [token]. Then it gets the [token] using the [code].

cwMethod2P2Title=Checking The Owner Privilege

cwMethod2P2content=Following the 1st section above, the servlet request the private information to the service provider of Profile in order to evaluate whether the user is the owner.

cwMethod2P3Title=Execution of Google Cloud SQL Service.

cwMethod2P3content=Farther, following the 2nd section above, the servlet execute the Google Cloud SQL Service with the parameter which class is Properties with the values of [token] and so on. In my case, I equip JDO database in appengine. Data from Google Cloud SQL overwrite when the key of the recordset exists, or add when otherwise.

cwMethod2P4Title=Polymorphism

cwMethod2P4content=As the call back of authentication is one entry and the servlet requires to quip multiple methods with the owner privilege, I prepare a flag which resolve the mothod. Before envoking the servlet, the flag was set with the value of method's name, and in the servlet the flag was evaluated whether method is executed.

cwMethod2P5Title=Database

cwMethod2P5content=This app uses 2 database. One is an external database Google Cloud SQL, which is connected by the user with the owner privilege and updates the inner database. The other is an inner database JDO, which is used to store data for '2D Canvas - Graph of the car mileage'. I renewed the specification from  being ever XML plain text file to json format data retrieved from JDO by means of RPC. 

