cwMethodP1content=I use 'ant' and 'python' to rename all the directories, filenames and included text with considering the capital letter or not. Eventually, some picture files turn to fail, so I replace them.

cwMethodP2Title=Add the native language.

cwMethodP2content=Due to the i18n, I can make it easily. I prepare the Japanese text properties file and indicate it to gwt.xml file. 

cwMethodP3Title=Reuse the previous version.

cwMethodP3content=I have had homepase, I can reuse part of the the javascript source by using JSNI.

cwMethodP4Title=Trouble.

cwMethodP4content=I had a trouble in attach the javascript source. It was altering widget's content and I can resolve the problem to put the funciton into asyncOnInitialize function. 

cwNotesDescription=Memorandum.

cwNotesName=Notes

cwNotesP1=I start to make the home page with HTML5 specification from February in 2011 to maintain and improve my IT skills. After that, I wonder to try Amazon EC2 or OS virtualization, it is difficult for me to execute. The former seems to need money, the later seems to need hardware with virtualization-capable cpu. In the summer I submitted an application of the SalesForce.com. I tried to configure the DB, but I couldn't. I think the system securities was not proper. After all, I can squeeze an output by making this homepage. A year 2011 was an awful year such as my pet loss, 3.11 earthquake, worldwide stock decline by European sovereign debt crisis and my failure in IT exam. I really relieved to complete the homepage.

cwNotesP2=I have once tied the iGoogle to make the widget after making the Javascript version. I ended up to fail because of cross-site-scripting problem as I used the XML to hold the car mileage data. In gwt, I troubled the performance. When I rewrite the car mileage graph program in java from the scratch, it looked slow in accessing xml. It seems to issue the callback in every xml element access. So I rewrite the program to use the JSNI. My developing machine specification is for a sever, and it has no video card. I can see the WebGL contents working by software rendering in Fedora 14, but I can't configure the linux to work it in the Linux 3.0 because GNOME's version is 2 despite of 3 in distribution version. I tried the GwtGL, I can't understand a view configuration so I reused the previous javascript version. (March 2012) 

cwNotesP3=I had a hard time implementing Google Cloud SQL. Eclipse doesn't load jdbc module automatically, so I needed to search blogs for information about the incident. And Eclipse didn't hava the functionality to save the password with hidden, so I alternated to use the Properties Class to pass the token or so. In the higher level programming, I'm required to understand sessions and authenticaion with roles such as OpenID. (July 2012)

cwNotesP4=As java updated to 7, I troubled some reason. I added the function that change the background color by the main menu's category. That have not used ui binder yet. At last I equiped the update window of Google Cloud SQL. (March 2013)

cwNotesP5=Despite I don't like changing main structure, I put a change to the code of "showcase" main.

cwNotesP6=As one of practices of HTML5, I implemented a slider bar of range type input. And my another new feature is the widget of grid. Redrawing on pressing the button was implemented by not handler but timer because of using JNSI. The grid data was generated from jdo database and was passed by RPC. Though I configured POM.xml, I couldn't build, so I suspended. Any way I begin to use the Google repository. (May 2013)

cwNotesP7=When modifying related CSS, I found function that compile with CSS. I applied it by specifying another CSS file to the example page. In addition, I disabled the tabs of the page in 'About This Homepase', 'Administrative' category. (June 2013)

cwNotesP8=I correct to make redrawing on pressing the button implement using handler from timer. (July 2013)

cwNotesP9=A new page calculates the prime numbers, then accumulates the frequency by the modulo into tables, and print the tables.  The 'gradient' mode results transit animation until the specific number. When clicking the graph, statistic information is displayed. Thought I were trying to make an example of MapReduce, I resulted a practice of Array in JavaScript. It seemed to be being cracked since last summer. (August 2013)

cwNotesPa=Trying Maven, I restructed the source directory and the war directory. But it resulted a failure. Then in order to ensure the build activities, I return to ant build ant eclipse IDE. Finally I figured out the datanucleus-izing lib is different from runtime library using by datanucleus-ized pg. In addition to it, it seems to have changed the request url of RPC, and worse crackked. I messed. I poured so long time to solve the problems that I couldn't make a big progress. I could only modify CwCanvas3D to vary the color by rotation angle. (December 2013)

cwNotesPb=For a long time, I have been challenging to implement JPA supported by RDBMS. Finally I found EclipseLink Page and succeeded to work. But Datanucleus version didn't work. (May 2014)

cwNotesPc=I did it. Maven and DataNuclues did work. There were many troubles. java.sql.Date for the key wasn't capable for old version. I couldn't use datanucleus-appengine, instead datanucleus-rdbms. (June 2014)

cwNotesPd=My new frontier is Mashup. As I failed to connect api from ajax a few years ago, I invoke API via server. And in convinience of development test, I set another server that controls the API. (July 2014)

cwNotesPe=I don't figure out how to manage the private key, and fear the social engineering, I didn't look into it.(August 2014)

cwNotesPf=Add the Widget whose list was generated by MapReduce.(September 2014)

cwNotesPg=Add session, expire, and status properties to control administrator login. Change web.xml, appengine-web.xml and MileageDataUitils to initiate the Entity Manager on app startup. Respectively adding servlet entry with <load-on-startup> element, adding <warmup-requests-enabled> element, and transfer it to servlet with Entity manager static class object and init() that preloads cache. Change MileageDataUtils to retain Entity Manager that remains instanciated while running. (December 2014)

cwNotesPh=As accessing port\:8181 services from client-side, I set the proxy server dealing with client-side request including parameter that identifies method. (January 2015)

cwNotesPi=Add CwXFrame to adjust screening of news by means of blacklist. CwXFrame is derived from CwFrame and equips authentication function. About authentication, add widget's returning locus to the login state properties so that oauth2callback can discriminate the return widget. (January 2015)

cwNotesPj=Implement MVP factory to correspond to mobile view referring to GWT SDK sample program MobileWebApp, but not call this an application yet. Just add mobile view though make difference in the source code. Due to requirement of two views, make singleton class abstract and make two view derived from it. (Feburary 2016)

cwNotesPk=I made a big try to couple Showcase and MobieWebApp of GWT Sample in my app TUPracticePieces. To introduce the MPV brought me a huge challenge. Everything has changed. I can manage to combinate Tree navigation and MVP app though there are many glitches. It is natural for me to add an Item of MVP app to Tree navigation, and a widget of the item goes to edit the widget. The app added to SingleSelectionModel is ContentWidget (Showcase)(is-a relation), whose name is AdminMileageView., and also has its own uibinder. It can transit a edit view(AdminMileageEditView) where the shell of app sets up the view as a member of  DeckPanel. Of cource these views inherit the view that has presenter because of two implementations for mobile and desktop. Meanwhile, gwt become 2.8 whose compilation is Java 8. By the way, I’ve heard that normal ecosystem’s fractal degree is 1.7, but  I think my neibourhood is over 10, it’s crazy. (November 2016)

cwNotesPl=Mashup2. This time, I use two iFrames. One is NodeJS web displaying SNMP MIB. The other is apache2 web displaying access-control still footages. (Octorber 2016)

cwNotesPm=Version update with some fixes. Gwt 2.9.0(java8),Datanucleus 5.0.0, appengine 1.9.82. (Octorber 2016)

