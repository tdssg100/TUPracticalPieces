cwMethodDescription = GWT demo Showcase の流用方法
cwMethodLink = ソースコード ダウンロード
cwMethodName = インプリメンテーション方法
cwMethodP1Title = プロジェクト名変更
cwMethodP1content = ant と python を使って、ディレクトリ、ファイル名、テキストを大文字、小文字考慮して、全て変換。画像データにも変換がかかり、不良画像を入れ替え。この時点でリコンパイルして動作することが確認できた。
cwMethodP2Title = Web表示文字
cwMethodP2content = 多言語化対応のためi18n技術が用いられており、日本語化はpropertiesファイルを追加して、gwt.xmlファイルにその言語を指定することで、対応できた。
cwMethodP3Title = 資源継承
cwMethodP3content = canvasタグを使用したページは過去にjavascriptで書いたものだったが、jsni技術のおかげで、少しの修正で流用できた。javascriptでは、Webの要素をDOMを使ってアクセスしていたものを、gwtではWigdetが基本になるので、WidgetにIdを付加する（）ことによってJavascriptからもアクセスできるようになっていた。また、CSSに対して、classの情報も付加できた。
cwMethodP4Title = 実装遅延
cwMethodP4content = Widgetに対する変更をJavascriptで行う際、onInitializeでは、エラーになったが、asynから実行するとうまくいった。
cwMethod2Description = 認証を受けて、サービスを実行する
cwMethod2Link = ソースコード ダウンロード
cwMethod2LinkSource = ソースコード
cwMethod2Name = ネットワーキング
cwMethod2P1Title = OAuth2.0認証
cwMethod2P1content = GWTはClinetとServerにわかれているが、Clientから認証局に認証を要求して、そのコールバックにServletを指定しておく(Google Api Console)とServer仕様の手順でキーのやりとりが行われる。Server仕様では、要求後、すぐにはTokenが返ってこず、一旦、ServletにCodeが返されてきて、そのCodeを使って、Tokenを取得する。
cwMethod2P2Title = 所有者権限確認
cwMethod2P2content = 上記第１節に続けて、同じServlet内で、所有者の権限を持つかどうかを、Profileサービスで個人情報を取得して、判断した。
cwMethod2P3Title = Google Cloud SQサービス実行
cwMethod2P3content = さらに、上記２節に続けて、取得したTokenなどをPropertiesクラスに設定して、Google Cloud SQLを実行した。appengineにJDOのデータベースをもたせたので、Google Cloud SQL からデータセット取得したものを、上書き（keyが同じ場合)、追加するようにした。
cwMethod2P4Title = 多態
cwMethodP4content = 所有者権限が必要な処理を実行する仕組みとして、フラグを用意し、フラグに処理するジョブ名を設定し、Servlet内で、上記第１・第２節を実行した後、フラグを評価し、処理に分岐するようにした。
cwMethod2P5Title = データベース
cwMethod2P5content = 外部データベースGoogle Cloud SQLを内部データベースJDOに所有者権限でコピーし、そのデータを'2D Canvas適用事例 - 走行距離グラフ化'で利用する形態にした。グラフ化の際には、今までJavascriptでテキストファイルのXMLデータを描画していたが、RPCでデータをJDOからJSON形式に抽出し描画するように変更した。
cwNotesDescription = おぼえがき
cwNotesName = メモ
cwNotesP1 = 失業中のスキルアップと維持のため2011年2月からHTML5対応のホームページを作りはじめた。その後、AmazonのEC２では、お金がかかるし、Ubuntusの仮想化では、ハードが仮想化に対応していないので不安になり止め。夏にSalesForce.comを申し込んで、顧客DBを作成しようとしたが、どうもセキュリティが甘いせいか失敗。ようやくGWTでどうにかアウトプットが出た。２０１１年は、ペットが死ぬし、3.11の大震災は起こるし、西欧発の世界同時株安になるわ、IPAの試験も２回とも不合格と、散々の１年でしたがとりあえず完成できてよかった。
cwNotesP2 = Javascript版のホームページ作成後、iGoogleでwidget化を試みたが、走行距離のデータをXMLにしていたので、クロスサイトスクリプティングになり、簡単には、データが読めなくなり断念している。また、GwtでXMLをアクセスすると、callbackがかかるようで、かなりの負荷があり、一度JAVAで書いたプログラムをJSNIを使って以前のJavascriptのコードを使用するように戻したりしている。サーバー仕様のマシンで開発しているため、WebGLが、当初作成時点では、Linux でソフトレンダリングで表示できたが、Linuxのアップグレードに伴って、GNOME３がハードスペック不足により、GNOME２になっているためか、WebGLが動作しなくなった。結局、Linuxをダウングレードして開発をおこなった。また、GwtGLもトライしたが、開発中で、以前のプログラムとのビューの設定方法の違いなどにより諦め、Javascriptを流用している。　（2012年3月）
cwNotesP3 = Google Cloud SQLを実行するのに苦労した。jdbcが自動ではlibに読み込まれず、ダウンロードしなければならない。また、サービスマネージャの引数にユーザ名とパスワードを指定するようになっているが、Eclipseでは、パスワードが表示されてしまうので、安全のため、TokenをもつPropertiesクラスを引数として渡して実行した。Sessionレスでのプログラミングだったので、べたに書いたが、認証関係は、モジュール化され提供されるのでしょう。また、権限も所有者と一般しかないが、OpenIDではRoleによって細かく制御が必要になるようだ。　（2012年7月）
cwNotesP4 = 今回のアップデートでは、カテゴリー毎に背景色を変更する機能の追加とGoogle Cloud SQLへのデータ更新用のダイアログの追加をしました。　（2013年3月）
cwNotesP5 = デモプログラムの基幹部分に手をくわえるのはきがひけるが、いい手段をおもいつかなくて、やむなくソースコードを変更。　（2013年3月）
cwNotesP6 = HTML5の新しい機能のスライダーを使ってみた。また、gridのWidgetをDynatableを参考に実装した。 Mavenに挑戦したが、ビルドできずサスペンド。Googleのリポジトリを利用開始。　（2013年5月）
cwNotesP7 = CSSに関する修正をしているとClient Bundleの機能があることを発見し、ページ別にCSSファイルを作成し、ソースコードにファイル指定した。 また、Showcaseのデフォルトでは、CSSとソースコードのタブが表示されるが、’このホームページについて’と’メンテナンス’カテゴリーについては、表示しないようにした。　（2013年6月）
cwNotesP8 = ボタン押下時の再描画をタイマー実装からイベントハンドラに訂正。（2013年7月）
cwNotesP9 = 新しいページ -素数の剰余系別頻度-を追加しました。このページは、指定された数までの素数を計算し、テーブルに剰余系別に出現数を保存し、結果をグラフで表示します。’gradient’　モードは、素数を求めながら、並列で、結果をアニメーションで表示します。JSNIを利用したので、簡単に並列処理ができました。グラフをクリックすると、その統計情報がクリックされます。　（2013年8月）
cwNotesPa = Mavenで開発しようと試みたが、ファイル構成、ビルドのライブラリの依存関係など解明できずあきらめました。もう一度、ant と eclipse の開発環境にもどり、ビルドの様子を調べながら、ようやくdatanucleusのコンパイル時と実行時の環境がEclipseでは設定できていないことを突き止め、ant でコンパイルし、Eclipseで実行することに成功しました（RunOnnServerではなくDevMode。Facet・JPAを使用せず）。 (2013年12月)
cwNotesPb = 長い間、RDBMS同期JPAの実装に取り組んできましたが、やっとEclipseLinkのページを見つけ動作することができました。　（2014年5月）
cwNotesPc = ついに成功することができました。MavenプロジェクトとDataNuclues JPAで動作を確認できました。トラブル続きでしたがいい経験になりました。　（2014年6月）
cwNotesPd = マッシュアップに挑戦。以前にAJAXからAPI接続に失敗していたので、今回は、サーバからAPIを呼び出すことにしました。そして、開発のデバックの手間を考えて、さらに新しくサーバのプロジェクトを設定してそのサーバーでAPIの制御をすることにしました。（2014年７月）
cwNotesPe = 公開鍵を指定するMySQLのSSL通信で設定しました。（2014年8月）
cwNotesPf = 直近30日間の国別ニュース頻度のトップ100リストの追加。集計はcronで行い、マップリデュースでtunewscount.appspot.com(dev:8282)にWebサービスを追加しました（tutodayshotspot.appspot.com(dev:8181)はグーグル認証の制約を外すことができず、PostでDatastore送信。MapReduceのライブラリにはDatastoreへのデータ出力がなかったため作成）。（2014年9月）
cwNotesPg = 管理者のログイン時の制御をおこなうため session, expire, status の属性を追加。アプリの起動時にJPA2.1のエンティティマネージャをインスタンス化するために、web.xml, appengine-web.xml, MileageDataUitils を変更しました。それぞれ、 <load-on-startup> タグの付いたservlet entry を追加、<warmup-requests-enabled> タグを追加、MileageDataUtilsをサーブレットに変更しました。また、JPA2.1の１次キャッシュのデタッチがトランザクションごとに発生していたのを、エンティティマネージャーをApp起動中トランザクションごとにクローズしないで、インスタンス化したまま保持することにより、解消しました（persistence.xmlにプロパティ追加）。（2014年12月）
cwNotesPh = デバック版ではポート8181でニュースの処理をおこなっているので、ウジェットから、8888のサーバにメソッドのパラメータをつけてリクエストをだして、プロキシサーバの要領でニュース件数を取得するようにしました。（2015年01月）
cwNotesPi = CwFrame を継承した CwXFrame を追加しました。追加されている機能は、認証とブラックリスト登録機能ですが、実装ついて、認証は、CwXFrame で、ブラックリスト登録機能は、CwFrameでフラグで切替表示しています。認証のコールバックで戻るWedgetを指定するために、ログイン情報に認証発行したWidgetを追加しました。（2015年01月）
cwNotesPj = モバイル用ヴューを実装するためＧＷＴ　ＳＤＫサンプルプログラムMobileWebAppを参考にして、ＭＶＰファクトリーを導入しました。 しかし、アプリケーションとは言えず、閲覧用のヴューをパソコンとスマートファオン用に用意しました。２つのヴューが必要なため、シングルトンで作成されていたクラスをAbstractにして、派生させました。話はそれますが、2015年後半、監視カメラのアクション検知の画像フィイルのサーバをAmazon EC を利用して、vsftpとapache2とangularで作成しました。 (2016年02月)
cwNotesPk = このGWTアプリケーションはShowcaseを元に作っりましたが、GWTサンプルから、MVPアプリMobileWebAppを組み入れることにしました。Treeナビゲーションの項目の一つを表を持つMVPアプリとし、その表の編集をMVPアプリの別のWidgetが行う構成にしました。まだ不具合がありますが、今回は大改修となりました。MVPの採用とともに、デスクトップ・モバイルで違うコンテンツAjaxを作成するClientFactoryパターンを導入しました。DBの一覧・編集にはRequestFactoryが採用されていました（サンプルでは、Objective（BigTable）ですが、MySQL(RDB）でもDatanucleusで一覧動作確認）。Java８でのコンパイルが必要なGWT２．８にバージョンがあがりました。 (2016年11月)
cwNotesPl = マッシュアップ 2 。今回は iFrame を利用しました。同じサーバーで動作している SNMP の MIB を表示する NodeJS の web と 入出管理画像ログ を表示する apache2 の web を表示します。 (2017年10月)
cwNotesPm = GWT 2.9.0にバージョンアップされたので更新しました（Java 8）。Datanucleus、appengineのバージョンアップも行いました。 (2020年12月)
cwNotesPn = アドミニスタ権限のページにログイン画面を作成した。(2024年6月)
cwNotesPo = AmazonのEC２にsystemdでjettyのもとにデプロイした。今回の改修ではGeminiを利用してわからないで放っておくというのがなくなった。(2024年6月)
cwPrefaceDescription = このホームページについて
cwPrefaceName = はじめに
cwPrefacePara1 = 初版(2012.03更新)
cwPrefacePara1cont = このホームページは、Google Web Toolkit のデモに含まれる Showcase の適用を試みました。
cwPrefacePara2 = 第2版(2012.07更新)
cwPrefacePara2cont = 'このホームページについて'カテゴリーの'ネットワーキング'、'HTML5 Trial'カテゴリーの'CSSレイアウト' と 'メンテナンス'カテゴリーの'JDO更新'を追加しました。 
cwPrefacePara3 = 第3版(2013.03更新)
cwPrefacePara3cont = 'メンテナンス'カテゴリーの'JDO更新'に'Add Google Cloud SQL'ボタンを追加し、それに伴い, ダイアボックス型の登録フォームを追加しました。また, メインメニューのカテゴリに従って、ペインの背景色を変更するようにプログラムを変更しました。
cwPrefacePara4 = 第4版(2013.05更新)
cwPrefacePara4cont = '2D Canvas - 走行距離グラフ化'に、再描画する時間間隔 と 回転角度のスライダを追加しました。ボタンが押されるときの再描画は、JNSIを使ていますが、イベント・ハンドラでなくタイマーで実装しました。'メンテナンス'カテゴリーの'JDO更新'に走行距離データのgridのWidgetを追加しました。データは、JDOのDBを利用しました（RPCでサーバとデータのやりとりをしたが、クライアントサイドではバイナリの処理が困難だったためサーバで全部文字列に変換した）。   
cwPrefacePara5 = 第5版(2013.06更新)
cwPrefacePara5cont = CSSに関する修正を行いました。
cwPrefacePara6 = 第6版(2013.07更新)
cwPrefacePara6cont = '3D Canvas - コッホ曲線の3D拡張'（CwCanvas3d）のマイナーチェインジをしました。
cwPrefacePara7 = 第7版(2013.08更新)
cwPrefacePara7cont = 素数の剰余系頻度分布図のページを追加しました。
cwPrefacePara8 = 第8版(2013.12更新)
cwPrefacePara8cont = appengine1.8.8更新。CwCanvas3dの描画色を回転角度により変化させるよう、再帰レベルのボタン押下時のモデリングで色を設定しました。
cwPrefacePara9 = 第9版(2014.05更新)
cwPrefacePara9cont = 今まで手動で、ローレベルの関数を使ってRDBMとJDOの同期をとっていたのを、EclipseLink を使ったJPAの実装に変更。
cwPrefaceParaa =第10版(2014.06更新)
cwPrefaceParaacont = Mavenプロジェクトの導入とDatanucleus JPAへ変更。
cwPrefaceParab = 第11版(2014.07更新)
cwPrefaceParabcont = 新しいページ’マッシュアップ - 最新のニュースと地図’を追加しました。このページは、最新の世界のニュースを取得して、その位置の地図を表示します。 API:Google News、Google Map、GeoNames.
cwPrefaceParac = 第12版(2014.08更新)
cwPrefaceParaccont = GoogleCloudSQLとの通信をSSLにしました。
cwPrefaceParad = 第13版(2014.09更新)
cwPrefaceParadcont = 直近30日間の国別ニュース出現数のトップ100リストをウジェットとして'マッシュアップ - 最新のニュースと地図'に追加しました。
cwPrefaceParae = 第14版(2014.12更新)
cwPrefaceParaecont = 管理者のログイン時の画面の制御をアプリの属性を追加してきめ細かく制御するように変更しました。また、アプリ起動時にJPA2.1のエンティティマネージャとキャッシュのプレロードを行うとともに、キャシュのデタッチがトランザクションごとに出ていたのを抑制するように変更しました。
cwPrefaceParaf = 第15版(2015.01更新)
cwPrefaceParafcont = 'マッシュアップ - 最新のニュースと地図'に過去に掲載した国別件数の履歴を変更しました。
cwPrefaceParag = 第16版(2015.01更新)
cwPrefaceParagcont = 新しいページ「 ニュース位置情報調整」を「メンテナンス」カテゴリーに追加しました。これは、認証機能をもち、「マッシュアップ」に表示されるニュースの位置情報が正しくないときに、その名前を次回のスクリーニングから排除するブラックリストに登録する機能をもちます。
cwPrefaceParah = 第17版(2015.更新)
cwPrefaceParahcont = 不明。
cwPrefaceParai = 第18版(2016.02更新)
cwPrefaceParaicont = モバイル用ヴューを実装するためCLIENTファクトリーを導入しました。しかし、アプリケーションの段階に達していません。
cwPrefaceParaj = 第19版(2016.11更新)
cwPrefaceParajcont = TreeナビゲーションのBLOG形式のGWTアプリ(Showcase派生）に、Treeの一項目として、サンプルのMVPパターンMobileWebAppを改変して、組み込みました。
cwPrefaceParak = 第20版(2017.10更新)
cwPrefaceParakcont = 新しいページ「 マッシュアップ 2 - アクセス管理」を「メンテナンス」カテゴリーに追加しました。これは、同じサーバーで動作している SNMP の MIB を表示する NodeJS の web と 入出管理画像ログ を表示する apache2 の web を iFrame 表示します。
cwPrefaceParal = 第21版(2020.12更新)
cwPrefaceParalcont = GWT 2.9.0、Datanucleus 5.0.0、appengine 1.9.82 にバージョンアップしました。
cwPrefaceParam = 第22版(2024.6更新)
cwPrefaceParamcont = アドミニストレート権限が必要なページに認証画面を追加しました。これは、DBにユーザのテーブルを用意して暗号化したパスワード保存することで実装しました。
cwPrefaceParan = 第23版(2020.12更新)
cwPrefaceParancont = GWT 2.12.1 のアップグレードに伴い、java 17, maven 3.9.9, jetty 12.1.16, ee10, JPA 3.1 に更新しました。GWTサンプルのMobileWebAppを組み込んだところを正常に動作するように修正しました。
